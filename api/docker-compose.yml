name: leasolve-api

services:
  leasolve.api:
    image: ${DOCKER_REGISTRY-}leasolveapi
    container_name: leasolve.api
    build:
      context: .
      dockerfile: src/leasolve.API/Dockerfile
      
  leasolve.database:
    image: postgres:18.3-alpine
    container_name: leasolve.database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "leasolve.db:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  leasolve.db: